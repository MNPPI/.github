name: Public Token-Free Security

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: public-token-free-security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Enforce public repository boundary
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          allowed_runners = {
              "ubuntu-slim",
              "ubuntu-latest",
              "ubuntu-22.04",
              "ubuntu-24.04",
              "ubuntu-26.04",
              "ubuntu-22.04-arm",
              "ubuntu-24.04-arm",
              "ubuntu-26.04-arm",
              "windows-latest",
              "windows-2022",
              "windows-2025",
              "windows-2025-vs2026",
              "windows-11-arm",
              "windows-11-vs2026-arm",
              "macos-latest",
              "macos-14",
              "macos-15",
              "macos-15-intel",
              "macos-26",
              "macos-26-intel",
          }
          ignored_parts = {
              ".git",
              ".quality",
              ".venv",
              "coverage",
              "dist",
              "node_modules",
              "vendor",
          }
          package_secret_names = {
              "GHCR_TOKEN",
              "GITHUB_PACKAGES_TOKEN",
              "NODE_AUTH_TOKEN",
              "NPM_AUTH_TOKEN",
              "NPM_TOKEN",
              "PACKAGE_TOKEN",
              "PACKAGES_TOKEN",
          }
          dependency_file_names = {
              "cargo.lock",
              "cargo.toml",
              "composer.json",
              "composer.lock",
              "go.mod",
              "go.sum",
              "package-lock.json",
              "package.json",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "poetry.lock",
              "pyproject.toml",
              "uv.lock",
              "yarn.lock",
          }
          expression_start = "$" + "{{"
          errors = []

          def add_error(path: Path, text: str, position: int, message: str) -> None:
              line = text.count("\n", 0, position) + 1
              errors.append(f"{path.as_posix()}:{line}: {message}")

          def read_text_files():
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or ignored_parts.intersection(path.parts):
                      continue
                  if path.stat().st_size > 2_000_000:
                      continue
                  try:
                      yield path, path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue

          def is_dependency_file(path: Path) -> bool:
              name = path.name.lower()
              return (
                  name in dependency_file_names
                  or name.startswith(("dockerfile", "gemfile", "pipfile", "requirements"))
                  or name.endswith((".gradle", ".gradle.kts"))
              )

          files = list(read_text_files())
          workflows = [
              (path, text)
              for path, text in files
              if path.parent.as_posix().endswith(".github/workflows")
              and path.suffix.lower() in {".yaml", ".yml"}
          ]

          runner_pattern = re.compile(
              r"^\s*['\"]?runs-on['\"]?\s*:\s*(.*?)\s*(?:#.*)?$",
              re.MULTILINE,
          )
          event_pattern = re.compile(
              r"^\s*['\"]?pull_request_target['\"]?\s*:", re.MULTILINE
          )
          uses_pattern = re.compile(
              r"^\s*-?\s*['\"]?uses['\"]?\s*:\s*['\"]?([^\s#'\"]+)",
              re.MULTILINE,
          )
          public_quality_pattern = re.compile(
              r"MNPPI/\.github/\.github/workflows/"
              r"public-quality\.yml@[0-9a-f]{40}",
              re.IGNORECASE,
          )
          secret_pattern = re.compile(
              r"\$\{\{\s*secrets\.([A-Za-z0-9_]+)", re.IGNORECASE
          )
          auth_env_pattern = re.compile(
              r"^\s*(NODE_AUTH_TOKEN|NPM_AUTH_TOKEN|NPM_TOKEN|PACKAGES?_TOKEN)"
              r"\s*:\s*([^#\r\n]*)",
              re.IGNORECASE | re.MULTILINE,
          )

          for path, text in workflows:
              for match in runner_pattern.finditer(text):
                  value = match.group(1).strip()
                  if not value or expression_start in value:
                      add_error(
                          path,
                          text,
                          match.start(),
                          "runner selection must use an explicit standard GitHub-hosted label",
                      )
                      continue

                  if value.startswith("[") and value.endswith("]"):
                      labels = [item.strip(" '\"") for item in value[1:-1].split(",")]
                  else:
                      labels = [value.strip(" '\"")]

                  invalid = [label for label in labels if label not in allowed_runners]
                  if invalid:
                      add_error(
                          path,
                          text,
                          match.start(),
                          "runner label is not a free standard GitHub-hosted label: "
                          + ", ".join(invalid),
                      )

              for match in event_pattern.finditer(text):
                  add_error(
                      path,
                      text,
                      match.start(),
                      "pull_request_target is not allowed for public repository checks",
                  )

              for match in uses_pattern.finditer(text):
                  target = match.group(1)
                  if (
                      target.casefold().startswith("mnppi/")
                      and not public_quality_pattern.fullmatch(target)
                  ):
                      add_error(
                          path,
                          text,
                          match.start(),
                          "MNPPI actions and reusable workflows are not allowed "
                          "unless they call the approved public quality workflow "
                          "at a full commit SHA",
                      )

              for match in secret_pattern.finditer(text):
                  name = match.group(1).upper()
                  if "PACKAGE" in name or name in package_secret_names:
                      add_error(
                          path,
                          text,
                          match.start(),
                          f"package credential secret is not allowed: {name}",
                      )

              for match in auth_env_pattern.finditer(text):
                  value = match.group(2).strip().strip("'\"")
                  if value:
                      add_error(
                          path,
                          text,
                          match.start(),
                          f"package credential environment variable must stay unset: {match.group(1)}",
                      )

          private_scope = "@" + "mnppi" + "/"
          npm_registry = "npm" + ".pkg." + "github.com"
          container_registry = "ghcr" + ".io/" + "mnppi"
          mnppi_git = re.compile(r"github\.com[/:]mnppi/", re.IGNORECASE)

          for path, text in files:
              folded = text.casefold()
              for value, message in (
                  (private_scope, "private MNPPI package scope is not allowed"),
                  (npm_registry, "GitHub npm registry is not allowed"),
                  (container_registry, "MNPPI container registry is not allowed"),
              ):
                  position = folded.find(value)
                  if position >= 0:
                      add_error(path, text, position, message)

              if is_dependency_file(path) or any(path == workflow[0] for workflow in workflows):
                  match = mnppi_git.search(text)
                  if match:
                      add_error(
                          path,
                          text,
                          match.start(),
                          "MNPPI Git dependency is not allowed",
                      )

          if errors:
              print("Public repository boundary violations:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)

          print(
              f"Public repository boundary passed for {len(workflows)} workflow file(s)."
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pinned security tools
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
          OSV_SCANNER_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          OSV_SCANNER_VERSION: 2.4.0
          SEMGREP_RULES_COMMIT: 4cccafad3ffe2484c60cf042e2cc42712b872382
          SEMGREP_VERSION: 1.168.0
          SYFT_SHA256: d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca
          SYFT_VERSION: 1.46.0
          ZIZMOR_VERSION: 1.26.1
        run: |
          set -euo pipefail

          tool_root="${RUNNER_TEMP}/mnppi-public-security"
          bin_dir="${tool_root}/bin"
          mkdir -p "${bin_dir}"

          install_tarball() {
            local name="$1"
            local url="$2"
            local sha256="$3"
            local archive="${tool_root}/${name}.tar.gz"
            local extract_dir="${tool_root}/${name}"

            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
              --output "${archive}" "${url}"
            echo "${sha256}  ${archive}" | sha256sum --check --status
            mkdir -p "${extract_dir}"
            tar -xzf "${archive}" -C "${extract_dir}"
            install -m 0755 "${extract_dir}/${name}" "${bin_dir}/${name}"
          }

          install_binary() {
            local name="$1"
            local url="$2"
            local sha256="$3"
            local binary="${tool_root}/${name}"

            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
              --output "${binary}" "${url}"
            echo "${sha256}  ${binary}" | sha256sum --check --status
            install -m 0755 "${binary}" "${bin_dir}/${name}"
          }

          install_tarball \
            gitleaks \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "${GITLEAKS_SHA256}"
          install_binary \
            osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            "${OSV_SCANNER_SHA256}"
          install_tarball \
            syft \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            "${SYFT_SHA256}"

          python -m venv "${tool_root}/python"
          "${tool_root}/python/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-cache-dir \
            "semgrep==${SEMGREP_VERSION}" \
            "zizmor==${ZIZMOR_VERSION}"
          ln -s "${tool_root}/python/bin/semgrep" "${bin_dir}/semgrep"
          ln -s "${tool_root}/python/bin/zizmor" "${bin_dir}/zizmor"

          rules_dir="${tool_root}/semgrep-rules"
          git init --quiet "${rules_dir}"
          git -C "${rules_dir}" remote add origin https://github.com/semgrep/semgrep-rules.git
          git -C "${rules_dir}" fetch --quiet --depth=1 origin "${SEMGREP_RULES_COMMIT}"
          git -C "${rules_dir}" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "${rules_dir}" rev-parse HEAD)" = "${SEMGREP_RULES_COMMIT}"

          echo "${bin_dir}" >> "${GITHUB_PATH}"
          echo "MNPPI_SEMGREP_RULES=${rules_dir}" >> "${GITHUB_ENV}"

      - name: Check workflow syntax
        run: npx --yes github-actionlint@1.7.12 -shellcheck "" -no-color

      - name: Check workflow security
        run: >-
          zizmor
          --min-severity=medium
          --min-confidence=high
          --format=plain
          --color=never
          --no-progress
          .github/workflows

      - name: Scan changed history for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          log_opts="-1 ${GITHUB_SHA}"
          if [[ -n "${BASE_SHA}" ]] && [[ ! "${BASE_SHA}" =~ ^0+$ ]]; then
            log_opts="${BASE_SHA}..${GITHUB_SHA}"
          fi
          gitleaks git . \
            --exit-code 1 \
            --log-opts "${log_opts}" \
            --no-banner \
            --no-color \
            --redact

      - name: Run local Semgrep rules
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -euo pipefail
          configs=()
          mapfile -t configs < <(
            for language in bash dockerfile go javascript json python terraform typescript yaml; do
              find "${MNPPI_SEMGREP_RULES}/${language}" \
                -type d \( -name security -o -name audit \) \
                -print 2>/dev/null
            done | while IFS= read -r config; do
              if [[ "${config}" != "${MNPPI_SEMGREP_RULES}/json/npm/security" ]]; then
                printf '%s\n' "${config}"
              fi
            done | sort -u
          )

          args=(scan --metrics=off --disable-version-check --oss-only --error)
          for config in "${configs[@]}"; do
            args+=(--config "${config}")
          done
          semgrep "${args[@]}" .

      - name: Scan lockfiles without dependency resolution
        run: |
          set -euo pipefail
          mkdir -p .quality
          set +e
          osv-scanner scan source \
            --recursive \
            --offline \
            --offline-vulnerabilities \
            --download-offline-databases \
            --no-resolve \
            --allow-no-lockfiles \
            --experimental-disable-plugins python/requirements \
            --format json \
            --output-file .quality/osv-scanner.json \
            --verbosity error \
            .
          status=$?
          set -e
          if (( status > 1 )); then
            exit "${status}"
          fi

          high_count="$(jq '[
            .results[]?.packages[]?.groups[]?
            | (.max_severity // "" | tonumber?) as $score
            | select($score >= 7.0)
          ] | length' .quality/osv-scanner.json)"
          if (( high_count > 0 )); then
            echo "Found ${high_count} high-severity dependency groups." >&2
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          mkdir -p .quality
          syft scan dir:. \
            --exclude '**/.git/**' \
            --exclude '**/.quality/**' \
            --exclude '**/node_modules/**' \
            -o cyclonedx-json=.quality/sbom.cdx.json \
            -q
          test -s .quality/sbom.cdx.json

      - name: Review changed dependencies and licenses
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            BUSL-1.1,
            Elastic-2.0,
            PolyForm-Noncommercial-1.0.0,
            PolyForm-Small-Business-1.0.0,
            SSPL-1.0
